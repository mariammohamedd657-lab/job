name: Investment dependency verification
on:
  push:
    branches: [main]
    paths:
      - 'app/quantification/InvestmentPanels.tsx'
      - 'tests/investment-dependencies.spec.ts'
      - 'tests/overview-mode.spec.ts'
      - 'app/quantification/Quantification.tsx'
      - 'app/quantification/UniversalQuantification.tsx'
      - '.github/workflows/investment-dependencies.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/investment-dependencies.spec.ts tests/overview-mode.spec.ts --reporter=line
