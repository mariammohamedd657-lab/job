name: Canonical registry validation
on:
  push:
    branches: [main]
    paths:
      - 'app/quantification/**'
      - 'tests/canonical-registry.spec.ts'
      - '.github/workflows/registry-check.yml'
  workflow_dispatch:
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npx playwright test tests/canonical-registry.spec.ts --grep 'canonical registry resolves|type restrictions|identical explicit|unknown scopes' --reporter=line
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/canonical-registry.spec.ts --grep 'browser' --reporter=line
