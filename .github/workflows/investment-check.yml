name: Investment calculation validation
on:
  push:
    branches: [main]
    paths:
      - 'app/quantification/**'
      - 'tests/investment*.spec.ts'
      - '.github/workflows/investment-check.yml'
  workflow_dispatch:
jobs:
  investment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npx playwright test tests/investment-shared-engine.spec.ts --grep-invert 'browser:' --reporter=line
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/investment-shared-engine.spec.ts tests/investment-panels.spec.ts --reporter=line
